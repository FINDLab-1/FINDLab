<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">What changes when diagnostics are added?</title><desc id="desc">ANYmal-C DWA case study. Aggregate input suggests increasing the planning envelope from 0.55 to 0.65 m. Added diagnostics and DWA execution summaries suggest reducing it to 0.45 m. These are paraphrased hypotheses, not established causes.</desc><rect width="1600" height="930" fill="white"/><text x="40" y="43" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#128477">ILLUSTRATIVE CASE  /  ANYmal-C · DWA</text><text x="40" y="99" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#182b3a">What changes when diagnostics are added?</text><text x="40" y="144" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#596c7c">Same original setting and allowed changes; different supplied evidence.</text><rect x="40" y="192" width="736" height="605" rx="14" fill="#f4f7f9" stroke="none"/><rect x="40" y="192" width="736" height="7" rx="0" fill="#2677c9" stroke="none"/><text x="68" y="249" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#2677c9">A  /  Aggregate input</text><text x="68" y="305" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#596c7c">OBSERVATIONS</text><text x="68" y="532" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#596c7c">TENTATIVE INTERPRETATION</text><text x="68" y="666" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#596c7c">PLANNING OBSTACLE ENVELOPE</text><rect x="824" y="192" width="736" height="605" rx="14" fill="#f4f7f9" stroke="none"/><rect x="824" y="192" width="736" height="7" rx="0" fill="#128477" stroke="none"/><text x="852" y="249" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#128477">L  /  Added diagnostic input</text><text x="852" y="305" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#596c7c">OBSERVATIONS</text><text x="852" y="532" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#596c7c">TENTATIVE INTERPRETATION</text><text x="852" y="666" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#596c7c">PLANNING OBSTACLE ENVELOPE</text><text x="68" y="351" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#182b3a">40 / 40 input episodes collide.</text><text x="68" y="390" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#182b3a">Outcome aggregates, setting definitions,</text><text x="68" y="429" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#182b3a">original values, and allowed changes.</text><text x="852" y="351" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#182b3a">Progress stalls; offset and heading error grow.</text><text x="852" y="388" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#182b3a">Tail clearance approaches zero.</text><text x="852" y="425" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#182b3a">DWA summary: 439 / 449 commands after</text><text x="852" y="462" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#182b3a">10 s have no valid trajectory.</text><text x="68" y="577" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#182b3a">The planning margin may be too small.</text><text x="852" y="577" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#182b3a">The envelope may restrict corrective motion.</text><text x="68" y="743" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#2677c9">0.55 → 0.65 m</text><text x="852" y="743" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#128477">0.55 → 0.45 m</text><text x="40" y="850" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#596c7c">Paraphrased from the paper’s case study. Neither response establishes the failure cause.</text><text x="40" y="891" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#596c7c">Planning envelope ≠ diagnostic body envelope. Physical collision detection is unchanged.</text></svg>
