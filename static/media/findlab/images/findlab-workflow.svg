<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc"><title id="title">FIND-Lab workflow</title><desc id="desc">Configure factors; measure whether and where; inspect recorded behavior; inspect centerline offset, heading error, progress, speeds and chassis clearance; propose at most one permitted adjustment and re-evaluate. Diagnostic evidence supports hypotheses, not verified root causes.</desc><rect width="1600" height="610" fill="white"/><text x="40" y="43" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#128477">FIND-Lab  /  from controlled factors to reviewable evidence</text><text x="40" y="96" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="700" fill="#182b3a">Connect the outcome to the behavior behind it.</text><rect x="40" y="145" width="350" height="345" rx="14" fill="#f4f7f9" stroke="none"/><rect x="62" y="169" width="53" height="39" rx="7" fill="#2677c9" stroke="none"/><text x="71" y="197" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="white">01</text><text x="62" y="258" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#182b3a">Configure</text><text x="62" y="305" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#2677c9">Control the factors</text><line x1="62" y1="331" x2="368" y2="331" stroke="#dbe4e9" stroke-width="2"/><text x="62" y="365" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Five environment kinds</text><text x="62" y="391" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Two robot platforms</text><text x="62" y="417" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Four navigation methods</text><path d="M396 317 H423 M415 308 L424 317 L415 326" stroke="#596c7c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="145" width="350" height="345" rx="14" fill="#f4f7f9" stroke="none"/><rect x="452" y="169" width="53" height="39" rx="7" fill="#2677c9" stroke="none"/><text x="461" y="197" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="white">02</text><text x="452" y="258" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#182b3a">Measure</text><text x="452" y="305" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#2677c9">Whether · Where</text><line x1="452" y1="331" x2="758" y2="331" stroke="#dbe4e9" stroke-width="2"/><text x="452" y="365" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Run outcomes</text><text x="452" y="391" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Termination locations</text><text x="452" y="417" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Factor-level comparisons</text><path d="M786 317 H813 M805 308 L814 317 L805 326" stroke="#596c7c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="820" y="145" width="350" height="345" rx="14" fill="#f4f7f9" stroke="none"/><rect x="842" y="169" width="53" height="39" rx="7" fill="#128477" stroke="none"/><text x="851" y="197" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="white">03</text><text x="842" y="258" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#182b3a">Inspect</text><text x="842" y="305" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#128477">Why · evidence</text><line x1="842" y1="331" x2="1148" y2="331" stroke="#dbe4e9" stroke-width="2"/><text x="842" y="365" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Route progress and speeds</text><text x="842" y="391" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Centerline offset</text><text x="842" y="417" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Heading error</text><text x="842" y="443" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Body, head, tail clearance</text><text x="842" y="469" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">Synchronized time cursor</text><path d="M1176 317 H1203 M1195 308 L1204 317 L1195 326" stroke="#596c7c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1210" y="145" width="350" height="345" rx="14" fill="#f4f7f9" stroke="none"/><rect x="1232" y="169" width="53" height="39" rx="7" fill="#128477" stroke="none"/><text x="1241" y="197" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="white">04</text><text x="1232" y="258" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#182b3a">Propose &amp; test</text><text x="1232" y="305" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#128477">How · re-evaluation</text><line x1="1232" y1="331" x2="1538" y2="331" stroke="#dbe4e9" stroke-width="2"/><text x="1232" y="365" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">A: aggregate input</text><text x="1232" y="391" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">L: added diagnostic input</text><text x="1232" y="417" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">At most one permitted</text><text x="1232" y="443" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#596c7c">adjustment</text><line x1="40" y1="531" x2="1560" y2="531" stroke="#dbe4e9" stroke-width="2"/><text x="40" y="574" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#596c7c">Diagnostic evidence supports testable hypotheses; proposed settings require separate evaluation.</text></svg>
